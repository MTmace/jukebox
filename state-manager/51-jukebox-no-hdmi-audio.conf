# Jukebox: no sound to the screens' HDMI. The music goes only to the DAC
# (Fruitbox -> Jukebox Bass filter -> Boss DAC).
#
# On the Pi 5 the HDMI audio devices vanish and come back whenever the screens
# are turned off and on (sleep), and PipeWire then moved the music onto them.
# With them disabled, there is nowhere else for the sound to go.
#
# Installed by install-state.sh to ~/.config/wireplumber/wireplumber.conf.d/
# (WirePlumber 0.5). Video on the screens is not affected.
# Exact names (from: pw-cli ls Device | grep device.name), no patterns.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-107c701400.hdmi" }
      { device.name = "alsa_card.platform-107c706400.hdmi" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
