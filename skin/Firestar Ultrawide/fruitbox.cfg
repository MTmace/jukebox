# Firestar ultrawide skin for Fruitbox v3 (generated by build_skin.py)
# Seeburg USC2 Firestar, 34" 21:9 panel under the flat glass.
# Fruitbox scales the skin to the screen, so a 2560x1080 panel works too.

[general]
SkinName = Firestar Ultrawide
SkinDescription = 144-selection Seeburg-style rack for a 34in 21:9 screen
SkinVersion = 1.0
NoDuplicates = Yes
SkinSize = 1 3440 1440
SkinSize = 2 2560 720

# No MusicPath here on purpose: fruitbox.ini owns the music and the
# per-genre MusicGroups that the genre button cycles through.
SortSongsBy = TrackNumber
SortSongsBy = Album
SortSongsBy = Artist

# Number-only keypad: 3-digit codes, A side 1xx / B side 2xx on each strip
SelectButtonsSequence = colrow
SelectButtons = 12
SelectButtons = 01234567
SelectButtons = 0123456789
AutoSelect = Yes
SelectTimeout = 10 seconds
SelectHoldTimeout = 3 seconds
HideInvalidStripCodes = Yes
TitleStripAutoTurnTime = 2 minutes

SongsPerTitleStrip = 2
PairSongs = Dual
TitleStripSize = 369 125
TitleStripBackground = strip_default.png
TitleStripBackground = strip_country.png Country
TitleStripBackground = strip_country.png Classic Country
TitleStripBackground = strip_country.png Contemporary Country
TitleStripBackground = strip_country.png Country Rock
TitleStripBackground = strip_rock.png Rock
TitleStripBackground = strip_rock.png Soft Rock
