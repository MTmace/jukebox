TitleStripBackground = strip_folk.png Bluegrass
TitleStripBackground = strip_christian.png Christian
TitleStripBackground = strip_christian.png Gospel
TitleStripBackground = strip_christian.png Contemporary Christian
TitleStripBackground = strip_christmas.png Christmas
TitleStripBackground = strip_christmas.png Holiday
