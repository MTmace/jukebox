TitleStripBackground = strip_other.png Other
TitleStripBackground = strip_other.png Instrumental
TitleStripMoveStyle = 50 4 no

# Strip titles come from the Custom field, filled with a shortened title
# by strip_titles.py (run after genre_library.py). Full titles elsewhere.
SongDescription = ${CUSTOM_TAG}
PairedSongDescription = ${PAIRED_CUSTOM_TAG}
ArtistDescription = ${SONG_ARTIST} / ${PAIRED_SONG_ARTIST}
MatchedArtistDescription = ${SONG_ARTIST}
ExtraDescription = ${STRIP_CODE}
ExtraDescription = ${PAIRED_STRIP_CODE}
SongText = 1 28 24 22 255 centre false -1 false 20 0 309
PairedSongText = 1 28 24 22 255 centre false -1 false 20 0 309
ArtistText = 2 255 255 255 255 centre true -1 false 0 0 345
ExtraText = 3 28 24 22 255 left false -1 false 8 6 0
ExtraText = 3 28 24 22 255 left false -1 false 8 82 0

SongLoadTime = 1.7 seconds
SongUnloadTime = 0
NowPlayingArtworkMode = auto

# Attract mode: list genres here to make the AttractMode button cycle
# Off -> each genre -> Any. Leave commented for a plain on/off toggle.
#AttractModeGenre = Rock & Roll
#AttractModeGenre = Soul

