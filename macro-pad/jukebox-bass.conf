# Jukebox bass knob: a PipeWire "bass shelf" placed in front of the DAC.
#
# install-bass.sh copies this to ~/.config/pipewire/pipewire.conf.d/ and
# fills in DAC_SINK_NAME with the InnoMaker DAC's PipeWire name. It adds a
# sound output called "Jukebox Bass" that becomes the Pi's default, so
# Fruitbox plays into it; it boosts or cuts everything below about 100 Hz and
# passes the sound on to the DAC. jukebox-bass.py turns the "Gain" up and
# down while the music plays (the knob), from -12 dB to +12 dB.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Jukebox Bass"
            media.name       = "Jukebox Bass"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = bass
                        label   = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "jukebox_bass"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "jukebox_bass.output"
                node.passive  = true
                target.object = "DAC_SINK_NAME"
            }
        }
    }
]
