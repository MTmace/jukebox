# Settings for jukebox-lights.py (the cabinet lights). Installed to
# /home/mtmace/fruitbox/jukebox-lights.ini; edit with:  nano /home/mtmace/fruitbox/jukebox-lights.ini
# After a change:  sudo systemctl restart jukebox-lights

[leds]
# LED strips wired straight to the Pi, one data pin each. yes / no
enabled = yes
# The patterned strips, listed TOP TO BOTTOM. Scenes use this order: the
# Rising theme's flames start on the last one and climb up, and the Relay
# fireballs run along the first, back along the next, and so on. Each name
# has its own [strip ...] section below. Leave a name out to stop using it.
strips = third window subs
# The white strip behind the selection panel and keys (empty = none).
white = white
# How bright the white strip is, 0-100 %, before the dimmer.
white_level = 100
# yes for 4-colour LEDs (RGBW: a white chip in each LED, as on your strips);
# also needs rgbw=on on the config.txt line. no for plain RGB strips.
rgbw = yes
# GRB for most WS2812B strips, RGB for the ALITOVE bullets. If red and green
# come out swapped, change this.
color_order = GRB
# Starting brightness, 0-100 %. The dim knob changes it (and remembers it).
brightness = 100
# Animation frames per second.
fps = 40

# One section per strip:
#   device  = the data pin it's on, made by a dtoverlay=ws2812-pio line in
#             /boot/firmware/config.txt with the same dev_name (see README)
#   leds    = LEDs on the strip
#   chain   = for strips chained on one pin: 1 = first in the chain (nearest
#             the Pi), 2 = next, and so on. num_leds on that pin's config.txt
#             line = all the chain's LEDs added up.
#   reverse = yes if the data runs through the strip from RIGHT to LEFT
#             (looking at the front of the jukebox), for example a strip
#             flipped so the chain can come back along it. Then everything
#             still moves the same way on every strip.
# A strip whose pin isn't set up yet is skipped (the log says so).
# Strips on their own pins instead: give each a different device and leave
# chain out.

# All four strips are one chain on pin 32 (GPIO 12), /dev/leds-fire:
# 52 + 55 + 53 + 46 = 206 LEDs (counted on the cabinet 2026-11-13).
[strip window]
# Front strip shining up at the window: first in the chain, data enters at
# its left end.
device = /dev/leds-fire
leds = 52
chain = 1
reverse = no

[strip subs]
# Front strip under it, lighting the subs: flipped, so the chain comes back
# along it from right to left.
device = /dev/leds-fire
leds = 55
chain = 2
reverse = yes

[strip third]
# The upper strip shining up the wire mesh: last in the chain.
device = /dev/leds-fire
leds = 53
chain = 3
reverse = no

[strip white]
# The white panel strip: last in the chain, after the upper strip.
# Any strip added after it in the chain glows, dims and turns off with it:
# add its LEDs to leds here AND to num_leds on the config.txt line.
device = /dev/leds-fire
leds = 46
chain = 4
reverse = no

[themes]
# The theme key (Insert or F16) steps through these, in this order. Each theme lists the
# pattern for the jukebox's states: idle, active, attract, and optionally sleep
# (a 4th word; without one, sleep shows the idle pattern, at the sleep level).
# Patterns (each strip runs its own copy): white, fire, vu, candle, aurora, lava,
# ocean, firestar, breathe, pulse, sparkle, rainbow, off. (vu is a music meter
# growing from the middle.)
# Scenes (the strips play off each other): rising, relay, duet, flow.
# Only these 4 for now, while they're fine-tuned. The others are kept below;
# to bring them back, use this full list instead:
#   order = white fire rising relay duet vu firestar lava ocean rainbow
order = white fire vu firestar

# Each theme: idle / active / attract (/ sleep) patterns. Sleep uses the idle
# pattern, dimmer, unless a 4th word is given. In every theme, starting up
# shows the idle look and shutting down turns all the strips off. The white
# panel strip is steady white in every theme (dimmed in idle, attract, sleep).
# Brightness: idle 20 %, active 100 %, attract 35 %, sleep 15 % (set in [levels]).
# White
#   startup:  steady white (idle look)
#   idle:     steady white, 20 %
#   active:   steady white, 100 %
#   attract:  steady white, 35 %
#   sleep:    steady white, 15 %
#   shutdown: off
white = white white white
# Fire
#   startup:  warm candle flicker (idle look)
#   idle:     warm candle flicker, 20 %
#   active:   flames rising along each strip, 100 %, pulsing with the bass
#   attract:  northern-lights waves (green, teal, violet), 35 %
#   sleep:    candle flicker, 15 %
#   shutdown: off
fire = candle fire aurora
# Rising
#   startup:  candle flicker (idle look)
#   idle:     candle flicker, 20 %
#   active:   flames start on the lower strip and climb into the ones above; bass hits climb from the subs to the window
#   attract:  waves flowing through all the strips in turn, 35 %
#   sleep:    candle flicker, 15 %
#   shutdown: off
rising = candle rising flow
# Relay
#   startup:  candle flicker (idle look)
#   idle:     candle flicker, 20 %
#   active:   fireballs run along the top strip and drop strip to strip, one per beat
#   attract:  waves flowing through all the strips in turn, 35 %
#   sleep:    candle flicker, 15 %
#   shutdown: off
relay = candle relay flow
# Duet
#   startup:  candle flicker (idle look)
#   idle:     candle flicker, 20 %
#   active:   the strips take turns, one burning bright while the others drop to embers, swapping on the beat
#   attract:  waves flowing through all the strips in turn, 35 %
#   sleep:    candle flicker, 15 %
#   shutdown: off
duet = candle duet flow
# VU
#   startup:  slow red glow (idle look)
#   idle:     slow red glow, 20 %
#   active:   VU meter growing from the middle with the music, lime to red
#   attract:  northern-lights waves, 35 %
#   sleep:    slow red glow, 15 %
#   shutdown: off
vu = breathe vu aurora
# Firestar
#   startup:  slow red glow (idle look)
#   idle:     slow red glow, 20 %
#   active:   red, yellow and lime bands drifting (the skin's colours)
#   attract:  northern-lights waves, 35 %
#   sleep:    slow red glow, 15 %
#   shutdown: off
firestar = breathe firestar aurora
# Lava
#   startup:  red and orange lava-lamp blobs (idle look)
#   idle:     red and orange lava-lamp blobs, 20 %
#   active:   lava-lamp blobs, 100 %
#   attract:  northern-lights waves, 35 %
#   sleep:    lava-lamp blobs, 15 %
#   shutdown: off
lava = lava lava aurora
# Ocean
#   startup:  calm blue and teal swells (idle look)
#   idle:     calm blue and teal swells, 20 %
#   active:   blue and teal swells, 100 %
#   attract:  northern-lights waves, 35 %
#   sleep:    blue and teal swells, 15 %
#   shutdown: off
ocean = ocean ocean aurora
# Rainbow
#   startup:  slow red glow (idle look)
#   idle:     slow red glow, 20 %
#   active:   rainbow chasing along the strips
#   attract:  northern-lights waves, 35 %
#   sleep:    slow red glow, 15 %
#   shutdown: off
rainbow = breathe rainbow aurora
# Shown for a few seconds when a coin drops, whatever the theme.
coin = sparkle

[sound]
# Make the cabinet strips follow the music: brightness rides the bass, the
# fire throws up extra flames on each beat, and the vu theme is a music meter.
# The lights listen to a copy of the Pi's own sound output (no microphone).
# The white panel strip never reacts. yes / no
enabled = yes
# Which states react (idle and attract have no user song playing).
# Add "attract" to make the dim aurora move with attract-mode songs too.
react = playing selecting
# Quietest the reacting strips go between beats, % of their normal brightness.
floor = 35
# How the sound is read: PipeWire's monitor of the default output, as the
# desktop user (mtmace, user number 1000; check with: id -u mtmace).
capture = runuser -u mtmace -- env XDG_RUNTIME_DIR=/run/user/1000 parec -d @DEFAULT_MONITOR@ --format=s16le --rate=11025 --channels=1 --raw --latency-msec=20

[levels]
# How bright each state is, % of the dimmer setting. Idle, attract and sleep
# also dim the white strip by the same amount. Idle = no song and no key for
# a minute (the state manager decides); playing = the jukebox is active.
idle = 20
playing = 100
selecting = 100
coin = 100
attract = 35
# Sleep: the screens are off (10 minutes idle, or the Pause key). Also dims
# the white strip.
sleep = 15

[controls]
# Keys that work from any keyboard or knob plugged into the Pi. Fruitbox still
# gets the keys too, so these are ones it doesn't use (it uses F1-F12).
# Several keys can share one job (separate them with spaces). A programmable
# USB knob set to send F14 / F15 when turned and F13 when pressed is a dimmer
# with an off button. Don't use the volume or mute media keys: the Pi's
# desktop would change the sound volume too.
off_key = KEY_SCROLLLOCK KEY_F13
dim_up_key = KEY_PAGEUP KEY_F14
dim_down_key = KEY_PAGEDOWN KEY_F15
theme_key = KEY_INSERT KEY_F16
# How much one dim key press (or knob click) changes the brightness, in %.
dim_step = 10
# After the theme key, show the new theme's playing look for this many seconds
# (at idle most themes share the same candle glow, so you'd see no change).
preview_seconds = 6

[timing]
# How long the "selecting" and "coin" patterns show before going back.
# selecting_seconds counts from the LAST key or button press. Only used when
# the state manager isn't running (with it, a key makes the jukebox active).
selecting_seconds = 30
coin_seconds = 3

[teensy]
# Leave empty to find the Teensy automatically.
port =

[fruitbox]
# Written by the hidden [status] box in the skin's fruitbox.cfg.
state_file = /dev/shm/jukebox_state.txt
# The jukebox's state, one word, written by the state manager (jukebox-state):
# starting, idle, active, attract, sleep or shutdown. The lights follow it.
# If it is missing (state manager not running) the lights decide for themselves
# from state_file and sleep_file, as they used to.
mode_file = /dev/shm/jukebox_mode
# Exists while the jukebox sleeps (older way, used only without mode_file).
sleep_file = /dev/shm/jukebox_sleep
