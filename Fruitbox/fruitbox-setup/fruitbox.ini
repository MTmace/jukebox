# Jukebox (Seeburg Firestar) fruitbox.ini, based on the Fruitbox 3.02.02 default.
# Lives at ~/fruitbox/fruitbox.ini; launch-fruitbox.sh passes it with --ini.
# Changes from the default are on lines that follow a  # JUKEBOX  comment.
# MusicPath: genre_library.py replaces the MusicPath line(s) below with one line
# per genre folder (MusicPath = <folder> = <genre>) so the MusicGroup button
# cycles genres. Until you run it, it plays the plain ~/Music library.

[general]
  MusicPath = $HOME/Music
  MusicGroupIncludeAllSongs = Yes
  MusicGroupAllSongsLabel = All Songs
  CustomMP3Tag = 
  MaxPlayQueueLength = 20
  LoopPlayQueue = No
  IgnoreArtistPrefixThe = Yes
  SongHistoryDepth = 20
  SongHistoryIncludeUserSelection = No
  # JUKEBOX: start quiet for background listening (the Pi had 50 until 2026-11-09).
  # Step 2 (was 5, 2026-11-11) so the lowest setting is 2 instead of 5: much quieter
  # floor, finer control at low volume; the DAC Digital level sets the ceiling.
  SongVolume = 4
  SongVolumeStep = 2
  FreePlay = Yes
  CreditsPerCoin1 = 1
  CreditsPerCoin2 = 2
  CreditsPerCoin3 = 5
  CreditsPerCoin4 = 10
  CreditsPerCoin5 = 25
  CreditsPerCoin6 = 100
  CreditsPerSong = 1
  InitialCredits = 0
  SaveCreditsOnExit = -1
  MenuColour = 255 128 255 0
  MenuBackgroundColour = 32 32 32 200
  FontScale = 0.8
  # JUKEBOX: don't sit at the skin chooser after a reboot
  SkinChooserTimeout = 10.0 Seconds
  SpectrumAudioSyncOffset = 0.0 Seconds

[attract mode]
  # JUKEBOX: Enable is only the state at start-up; the AttractMode button toggles it live
  Enable = No
  Choice = Random
  Interval = 0.2 Minutes
  MaxVolume = 100
  FadeIn = 0.0 Seconds
  FadeOut = 0.0 Seconds
  FadeInPosition = 0.0 Seconds
  FadeOutPosition = 0.0 Seconds
  SkipLoad = Yes
  #  FadeIn = 6.0 Seconds
  #  FadeOut = 3.0 Seconds
  #  FadeInPosition = 20.0 Seconds
  #  FadeOutPosition = 30.0 Seconds

[multicast]
  Mode = Disabled
  IPAddress = 239.255.10.10
  Port = 5000
  Interface = 
  TTL = 1
  Loopback = No
  TxVideoFps = 15
  TxVideoBitrateKbps = 1200
  TxAudioBitrateKbps = 192
  RxLatencyMs = 200
  RxReconnectSeconds = 5
  StatusIPAddress = 239.255.10.11
  StatusPort = 5001
  StatusTTL = 1

[skins]
  Directory = /opt/fruitbox/skins/

[buttons]
  Left = KBD0 Left
  Right = KBD0 Right
  Select0 = KBD0 0
  Select1 = KBD0 1
  Select2 = KBD0 2
  Select3 = KBD0 3
  Select4 = KBD0 4
  Select5 = KBD0 5
  Select6 = KBD0 6
  Select7 = KBD0 7
  Select8 = KBD0 8
  Select9 = KBD0 9
  SelectA = KBD0 A
  SelectB = KBD0 B
  SelectC = KBD0 C
  SelectD = KBD0 D
  SelectE = KBD0 E
  SelectF = KBD0 F
  SelectG = KBD0 G
  SelectH = KBD0 H
  SelectI = KBD0 I
  SelectJ = KBD0 J
  SelectK = KBD0 K
  SelectL = KBD0 L
  SelectM = KBD0 M
  SelectN = KBD0 N
  SelectO = KBD0 O
  SelectP = KBD0 P
  SelectQ = KBD0 Q
  SelectR = KBD0 R
  SelectS = KBD0 S
  SelectT = KBD0 T
  SelectU = KBD0 U
  SelectV = KBD0 V
  SelectW = KBD0 W
  SelectX = KBD0 X
  SelectY = KBD0 Y
  SelectZ = KBD0 Z
  Select = KBD0 Return
  Random = KBD0 Space
  Skip = KBD0 Backspace
  Pause = KBD0 ;
  VolUp = KBD0 =
  VolDown = KBD0 -
  Mute = KBD0 Left Ctrl
  ClearQueue = KBD0 Delete
  ShuffleQueue = KBD0 Left Alt
  Up = KBD0 Up
  Down = KBD0 Down
  LeftScreen = KBD0 [
  RightScreen = KBD0 ]
  LeftSort = KBD0 ,
  RightSort = KBD0 .
  # JUKEBOX: attract mode toggle; the Pro Micro sends the ' key
  AttractMode = KBD0 '
  LoopQueue = KBD0 F11
  FreePlay = KBD0 F12
  # JUKEBOX: genre button; the Pro Micro sends KEY_RIGHT_ALT
  MusicGroup = KBD0 Right Alt
  Coin1 = KBD0 F1
  Coin2 = KBD0 F2
  Coin3 = KBD0 F3
  Coin4 = KBD0 F4
  Coin5 = KBD0 F5
  Coin6 = KBD0 F6
  ClearCredits = KBD0 CapsLock
  Flag1 = KBD0 F7
  Flag2 = KBD0 F8
  Flag3 = KBD0 F9
  Flag4 = KBD0 F10
  Menu = KBD0 Tab
  Search = KBD0 /
  Mouse = 
  Screenshot = KBD0 Right Ctrl
  Quit = KBD0 Escape
  PowerOff = KBD0 SysReq

[touch screen]
  Enable = No

[mouse]
  Enable = No
  Bitmap = 
  Size = 0 0
  Angle = 0 0 0
  Tint = 255 255 255 255
  HorizontalFlip = No
  VerticalFlip = No
  HotSpot = 0 0
  HideAfter = 5.0 Seconds

[joystick]
  Enable = No
  DisableTitleStripFlip = No
  Bitmap = 
  Size = 0 0
  Angle = 0 0 0
  Tint = 255 255 255 255
  HorizontalFlip = No
  VerticalFlip = No
  Offset = 0 0
